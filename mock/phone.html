<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAG モック (スマホ)</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; min-height: 100vh;
    background: radial-gradient(900px 600px at 50% 0%, #1a2130, #090b0e);
    color: #8a96a8; font: 13px "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
  }
  figure { margin: 0; display: grid; justify-items: center; gap: 12px; }
  .phone { width: 390px; height: 844px; padding: 12px; border-radius: 52px; background: #000; box-shadow: 0 0 0 2px #2a313c, 0 40px 100px rgba(0, 0, 0, .6); }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 40px; background: #0c0f13; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 460px; }
  nav button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid #303a48; background: #1f2631; color: #d7dee9; font: inherit; cursor: pointer; }
  nav button.active { border-color: #5b9dff; background: rgba(91, 157, 255, .18); }
  @media (max-height: 960px) { .phone { transform: scale(.82); transform-origin: top center; margin-bottom: -152px; } }
</style>
</head>
<body>
<figure>
  <nav id="pages">
    <button data-src="index.html" class="active">アプリ</button>
    <button data-src="pair.html?state=pair">QR を読んだ後</button>
    <button data-src="pair.html?state=expired">QR の期限切れ</button>
    <button data-src="pair.html?state=unregistered">登録していない端末</button>
  </nav>
  <div class="phone"><iframe id="screen" src="index.html" title="DRAG のスマホ画面"></iframe></div>
  <figcaption>390 × 844</figcaption>
</figure>
<script>
  for (const b of document.querySelectorAll('#pages button')) {
    b.addEventListener('click', () => {
      document.getElementById('screen').src = b.dataset.src;
      document.querySelectorAll('#pages button').forEach(x => x.classList.toggle('active', x === b));
    });
  }
</script>
</body>
</html>
